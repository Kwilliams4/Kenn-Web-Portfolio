name: Deploy Static Content to Pages
# ... (simplified YAML for brevity)
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node_version: 20, cache: "npm" }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: "./dist" }
      - id: deployment
        uses: actions/deploy-pages@v4
